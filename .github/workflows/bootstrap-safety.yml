name: Bootstrap safety

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://localhost/creator_ai_tools_ci
      DIRECT_URL: postgresql://localhost/creator_ai_tools_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:bootstrap
      - run: npm run test:contract
      - run: npm run test:first-session
      - run: npm run verify
